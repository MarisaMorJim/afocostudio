(function(){
 const trigger=document.getElementById('menu-trigger'),menu=document.getElementById('site-menu');
 function setOpen(v){menu.hidden=!v;trigger.setAttribute('aria-expanded',String(v));trigger.setAttribute('aria-label',v?'Cerrar menú':'Abrir menú');}
 trigger.addEventListener('click',()=>setOpen(menu.hidden));
 document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
 document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!trigger.contains(e.target))setOpen(false)});

})();
